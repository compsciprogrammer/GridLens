services:
  - type: web
    name: gridlens-demo
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GRIDLENS_FREE_DEMO
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.11"
